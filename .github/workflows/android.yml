# Verificação automática do app Android.
# Roda a cada push (em qualquer ramo) que mexa na pasta android/:
# compila o app, roda os testes e o lint (verificador de problemas comuns).
name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: # permite rodar manualmente na aba Actions

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Guarda downloads do Gradle entre execuções para ficar mais rápido.
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes, build e lint
        run: ./gradlew --no-daemon testDebugUnitTest :core:domain:test assembleDebug lintDebug

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-android
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
